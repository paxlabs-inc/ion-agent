apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ion
  namespace: ion
  labels:
    app.kubernetes.io/name: ion
  annotations:
    # TLS is terminated at the Ingress. Adjust for your controller/issuer.
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ion.example.com
      secretName: ion-tls
  rules:
    - host: ion.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ion
                port:
                  number: 80
