[build]
builder = "DOCKERFILE"
dockerfilePath = "/packaging/privatecomputer/Dockerfile"
watchPatterns = [
  "cmd/ion-computer/**",
  "go.mod",
  "go.sum",
  "internal/privatecomputer/**",
  "packaging/privatecomputer/**",
]

[deploy]
healthcheckPath = "/readyz"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
drainingSeconds = 15
