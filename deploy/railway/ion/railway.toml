[build]
builder = "DOCKERFILE"
dockerfilePath = "/docker/Dockerfile"
watchPatterns = [
  "assets/**",
  "cmd/**",
  "docker/**",
  "go.mod",
  "go.sum",
  "internal/**",
  "pkg/**",
  "ui/**",
]

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
drainingSeconds = 15
