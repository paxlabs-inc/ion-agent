skill:
  name: gif-search
  version: 1.1.0
  summary: Search/download GIFs from Tenor via curl + jq
  author: Ion Agent
  license: MIT
  platforms: [linux, macos, windows]

triggers:
  keywords: [gif, tenor, reaction gif, animated gif, search gif, download gif]
  intents: [search_gifs, download_gif, find_gif, gif_search]
  patterns:
    - "(search|find|get|download) .*(gif|gifs|reaction)"
    - "tenor"
    - "gif (for|of|about) .+"

requires:
  env_all: [TENOR_API_KEY]
  tools:
    - name: terminal
      required: true
  binaries: [curl, jq]

provides:
  capabilities: [gif_search, gif_download, gif_metadata]
  output_types: [.gif]

actions:

  search_gifs:
    description: Search Tenor for GIFs matching a query
    trigger_phrases: ["search for gifs", "find a gif", "look up gif", "reaction gif"]
    rules:
      - priority: CRITICAL
        text: "URL-encode the query — use + for spaces and %XX for special characters"
      - priority: HIGH
        text: "Use tinygif URLs for chat/bandwidth-constrained contexts"
      - priority: HIGH
        text: "Default limit is 20; max is 50"
      - priority: NORMAL
        text: "GIF URLs work directly in markdown: ![alt](url)"
    data:
      - key: base_url
        string_value: "https://tenor.googleapis.com/v2/search"
      - key: api_parameters
        map_value:
          entries:
            q: { string_value: "Search query (URL-encode spaces as +)" }
            limit: { string_value: "Max results 1-50, default 20" }
            key: { string_value: "API key from $TENOR_API_KEY" }
            media_filter: { string_value: "Filter: gif, tinygif, mp4, tinymp4, webm" }
            contentfilter: { string_value: "Safety: off, low, medium, high" }
            locale: { string_value: "Language: en_US, es, fr, etc." }
      - key: media_formats
        map_value:
          entries:
            gif: { string_value: "Full quality GIF" }
            tinygif: { string_value: "Small preview GIF" }
            mp4: { string_value: "Video version (smaller file size)" }
            tinymp4: { string_value: "Small preview video" }
            webm: { string_value: "WebM video" }
            nanogif: { string_value: "Tiny thumbnail" }
    examples:
      - label: "search and get GIF URLs"
        language: bash
        code: |
          curl -s "https://tenor.googleapis.com/v2/search?q=thumbs+up&limit=5&key=${TENOR_API_KEY}" | jq -r '.results[].media_formats.gif.url'
      - label: "get smaller preview versions"
        language: bash
        code: |
          curl -s "https://tenor.googleapis.com/v2/search?q=nice+work&limit=3&key=${TENOR_API_KEY}" | jq -r '.results[].media_formats.tinygif.url'

  download_gif:
    description: Search and download a GIF to a local file
    trigger_phrases: ["download a gif", "save gif", "download the top gif"]
    rules:
      - priority: HIGH
        text: "Search first to get URL, then curl -sL to download"
      - priority: NORMAL
        text: "Save as .gif extension"
    examples:
      - label: "search and download top result"
        language: bash
        code: |
          URL=$(curl -s "https://tenor.googleapis.com/v2/search?q=celebration&limit=1&key=${TENOR_API_KEY}" | jq -r '.results[0].media_formats.gif.url')
          curl -sL "$URL" -o celebration.gif

  get_metadata:
    description: Get full metadata for GIF search results
    trigger_phrases: ["gif details", "gif metadata", "gif info"]
    rules:
      - priority: HIGH
        text: "Include title, URL, preview URL, and dimensions"
    examples:
      - label: "get full metadata"
        language: bash
        code: |
          curl -s "https://tenor.googleapis.com/v2/search?q=cat&limit=3&key=${TENOR_API_KEY}" | jq '.results[] | {title: .title, url: .media_formats.gif.url, preview: .media_formats.tinygif.url, dimensions: .media_formats.gif.dims}'

guardrails:
  - text: "URL-encode search queries — use + for spaces"
    scope: ALWAYS
  - text: "Never expose TENOR_API_KEY in output"
    scope: ALWAYS

related: []
