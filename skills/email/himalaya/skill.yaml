skill:
  name: himalaya
  version: 1.1.0
  summary: Himalaya CLI for IMAP/SMTP email from terminal
  author: community
  license: MIT
  platforms: [linux, macos, windows]

triggers:
  keywords: [email, himalaya, imap, smtp, inbox, send email, read email]
  intents: [send_email, read_email, list_emails, search_email, reply_email, manage_email]
  patterns:
    - "(send|read|list|search|check) .*(email|mail|inbox)"
    - "(reply|forward) .*(email|mail)"
    - "himalaya"

requires:
  binaries: [himalaya]
  tools:
    - name: terminal
      required: true

provides:
  capabilities: [email_send, email_read, email_search, email_manage, email_attachments]
  output_types: [.json, .txt]

actions:

  setup:
    description: First-time Himalaya installation and configuration
    trigger_phrases: ["set up email", "configure himalaya", "email setup"]
    rules:
      - priority: CRITICAL
        text: "Config file at ~/.config/himalaya/config.toml — run 'himalaya account configure' for interactive wizard"
      - priority: CRITICAL
        text: "v1.2.0+ uses folder.aliases.X (plural dotted keys) — old [folder.alias] sub-section is silently ignored"
      - priority: HIGH
        text: "Install: pre-built binary via curl, brew install himalaya, or cargo install himalaya"
      - priority: HIGH
        text: "Store passwords securely via pass, system keyring, or a command that outputs the password"
      - priority: NORMAL
        text: "Use pty=true for interactive setup: terminal(command='himalaya account configure', pty=true)"
    data:
      - key: install_methods
        map_value:
          entries:
            binary: { string_value: "curl -sSL https://raw.githubusercontent.com/pimalaya/himalaya/master/install.sh | PREFIX=~/.local sh" }
            homebrew: { string_value: "brew install himalaya" }
            cargo: { string_value: "cargo install himalaya --locked" }

  list_emails:
    description: List emails in a folder
    trigger_phrases: ["show inbox", "list emails", "check email", "recent emails"]
    rules:
      - priority: HIGH
        text: "Use --output json for structured output that's easier to parse"
      - priority: HIGH
        text: "Message IDs are relative to current folder — re-list after folder changes"
      - priority: NORMAL
        text: "Default folder is INBOX; use --folder for others"
    data:
      - key: commands
        map_value:
          entries:
            inbox: { string_value: "himalaya envelope list" }
            specific_folder: { string_value: 'himalaya envelope list --folder "Sent"' }
            paginated: { string_value: "himalaya envelope list --page 1 --page-size 20" }
            json: { string_value: "himalaya envelope list --output json" }

  search_emails:
    description: Search emails by criteria
    trigger_phrases: ["search emails", "find email", "emails from"]
    rules:
      - priority: HIGH
        text: "Use himalaya envelope list with search terms: from, subject, etc."
    data:
      - key: command
        string_value: "himalaya envelope list from john@example.com subject meeting"

  read_email:
    description: Read a specific email
    trigger_phrases: ["read email", "open email", "show email"]
    rules:
      - priority: HIGH
        text: "Use himalaya message read ID for plain text, himalaya message export ID --full for raw MIME"
    data:
      - key: commands
        map_value:
          entries:
            read: { string_value: "himalaya message read 42" }
            export: { string_value: "himalaya message export 42 --full" }

  reply_email:
    description: Reply to an email
    trigger_phrases: ["reply to email", "respond to email", "reply"]
    rules:
      - priority: HIGH
        text: "Non-interactive: use himalaya template reply ID | sed | himalaya template send"
      - priority: HIGH
        text: "Or build reply manually with cat heredoc piped to himalaya template send"
      - priority: NORMAL
        text: "himalaya message reply ID --all for reply-all (needs $EDITOR)"
    examples:
      - label: "non-interactive reply"
        language: bash
        code: |
          himalaya template reply 42 | sed 's/^$/\nYour reply text here\n/' | himalaya template send

  send_email:
    description: Compose and send a new email
    trigger_phrases: ["send email", "compose email", "new email", "write email"]
    rules:
      - priority: CRITICAL
        text: "Non-interactive from agent: pipe message via stdin to himalaya template send"
      - priority: HIGH
        text: "Use heredoc with From/To/Subject headers followed by blank line and body"
      - priority: NORMAL
        text: "himalaya message write -H 'To:...' -H 'Subject:...' 'body' also works"
    examples:
      - label: "send email via heredoc"
        language: bash
        code: |
          cat << 'EOF' | himalaya template send
          From: you@example.com
          To: recipient@example.com
          Subject: Test Message

          Hello from Himalaya!
          EOF

  manage_email:
    description: Move, copy, delete emails and manage flags
    trigger_phrases: ["move email", "delete email", "flag email", "archive email"]
    rules:
      - priority: HIGH
        text: "Move: himalaya message move 'Folder' ID (target folder first, then message ID)"
      - priority: HIGH
        text: "Delete: himalaya message delete ID"
      - priority: NORMAL
        text: "Flags: himalaya flag add/remove ID --flag seen|answered|flagged"
    data:
      - key: commands
        map_value:
          entries:
            move: { string_value: 'himalaya message move "Archive" 42' }
            copy: { string_value: 'himalaya message copy "Important" 42' }
            delete: { string_value: "himalaya message delete 42" }
            add_flag: { string_value: "himalaya flag add 42 --flag seen" }
            remove_flag: { string_value: "himalaya flag remove 42 --flag seen" }

  manage_folders:
    description: List and manage email folders
    trigger_phrases: ["list folders", "show folders", "email folders"]
    rules:
      - priority: HIGH
        text: "Use himalaya folder list to show all folders"
    data:
      - key: command
        string_value: "himalaya folder list"

guardrails:
  - text: "Always use folder.aliases.X (plural dotted keys) in config — old alias sub-section is silently ignored on v1.2.0+"
    scope: ALWAYS
  - text: "Message IDs are relative to current folder — re-list after folder changes"
    scope: READ_OPS
  - text: "Use --output json for structured programmatic output"
    scope: READ_OPS
  - text: "Pipe input for composing emails — avoid interactive $EDITOR when possible from agent"
    scope: WRITE_OPS

related: []
