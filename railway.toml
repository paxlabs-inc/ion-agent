[build]
builder = "DOCKERFILE"
dockerfilePath = "/Dockerfile"
watchPatterns = [
  "Dockerfile",
  "railway.toml",
  "assets/**",
  "cmd/**",
  "internal/**",
  "packaging/**",
  "pkg/**",
  "ui/**",
  "go.mod",
  "go.sum",
]

[deploy]
healthcheckPath = "/readyz"
healthcheckTimeout = 600
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
drainingSeconds = 45
