# Local single-container Ion appliance.
#
#   docker compose -f docker/docker-compose.yml up --build
#   open http://127.0.0.1:8080
services:
  ion:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: local
    image: ion:local
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
      ION_WEB_ORIGIN: ${ION_WEB_ORIGIN:-http://127.0.0.1:8080}
      ION_AUTH_USERNAME: ${ION_AUTH_USERNAME:-}
      ION_AUTH_PASSWORD: ${ION_AUTH_PASSWORD:-}
      ION_AUTH_PASSWORD_HASH: ${ION_AUTH_PASSWORD_HASH:-}
      ION_VAULT_KEK: ${ION_VAULT_KEK:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      ION_TAVILY_SEARCH_ENDPOINT: ${ION_TAVILY_SEARCH_ENDPOINT:-}
      ION_SEARCH_ENDPOINT: ${ION_SEARCH_ENDPOINT:-}
      ION_AUTO_INIT: "1"
      ION_DEV_FILE_KEK: "1"
    volumes:
      - ion-data:/data
    restart: unless-stopped
    shm_size: 1gb
    stop_grace_period: 60s

volumes:
  ion-data:
