# Local single-host Ion stack.
#
# The operator serves plain HTTP on loopback only. This compose file uses host
# networking so the container's 127.0.0.1:4174 is reachable at the host's
# http://127.0.0.1:4174 without a bridge port map (which cannot reach a
# loopback-bound listener).
#
#   docker compose -f docker/docker-compose.yml up --build
#   open http://127.0.0.1:4174
#
# Host networking is Linux-only. On Docker Desktop (macOS/Windows), use the
# TLS reverse-proxy stack in deploy/compose instead. See docker/README.md.
services:
  ion:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        VERSION: local
    image: ion:local
    network_mode: host
    environment:
      ION_DATA_DIR: /data
      ION_WEB_LISTEN: 127.0.0.1:4174
      ION_WEB_ORIGIN: ${ION_WEB_ORIGIN:-}
      ION_AUTH_USERNAME: ${ION_AUTH_USERNAME:-}
      ION_AUTH_PASSWORD: ${ION_AUTH_PASSWORD:-}
      ION_AUTH_PASSWORD_HASH: ${ION_AUTH_PASSWORD_HASH:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      ION_TAVILY_SEARCH_ENDPOINT: ${ION_TAVILY_SEARCH_ENDPOINT:-}
      ION_SEARCH_ENDPOINT: ${ION_SEARCH_ENDPOINT:-}
      # Development convenience only. Never enable in production.
      ION_AUTO_INIT: "1"
      ION_DEV_FILE_KEK: "1"
    volumes:
      - ion-data:/data
    restart: unless-stopped
    stop_grace_period: 15s

volumes:
  ion-data:
